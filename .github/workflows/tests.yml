name: tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so diff-cover can find the merge base with
          # origin/<base>. fetch-depth: 1 (the default) leaves the PR head
          # and the base disconnected and `git diff base...HEAD` fails.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov diff-cover

      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=gTools \
            --cov-report=term-missing \
            --cov-report=xml \
            -ra

      # Diff-cover enforces coverage on the lines this PR actually changes,
      # not on the whole codebase. 70% matches Azure DevOps' default for
      # changed-lines coverage (Microsoft Learn:
      # https://learn.microsoft.com/azure/devops/pipelines/test/review-code-coverage-results).
      # Avoids the gaming problem Marick warned about with global thresholds
      # while still preventing silent regressions on new code.
      - name: Enforce 70% coverage on changed lines (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          diff-cover coverage.xml \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=70

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
